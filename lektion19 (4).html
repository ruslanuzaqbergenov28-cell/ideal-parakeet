const VOW=/ie|ei|au|eu|äu|[aeiouäöü]/g,VS=["a","i","o","u","e","ie","ei"];
function mut(a,v){let st=0,en=a.length;
 if(v[6]==="sep"){const sp=a.indexOf(" ");if(sp>0)en=sp;else{const g=a.indexOf("ge",2);st=(g>0?g+2:0)}}
 else{const m=/^(ge|be|ver|ent|er|emp|zer)/.exec(a);if(m)st=m[0].length}
 if(en===a.length&&/en$/.test(a))en-=2;
 const out=[];[...a.matchAll(VOW)].filter(x=>x.index>=st&&x.index<en).forEach(x=>VS.forEach(r=>{if(r!==x[0])out.push(a.slice(0,x.index)+r+a.slice(x.index+x[0].length))}));return out}

 if(v[6]==="sep"){const pt=v[1].split(" ").pop(),b=v[0].slice(pt.length).replace(/e?n$/,"");return kd===1?b+"te "+pt:pt+"ge"+b+"t"}

 return kd===1?st+"te":(pre?"":"ge")+st+"t"}

 const cp=(a,b)=>{let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i};
 const sc=x=>{const w=x[kd];return (x[6]===v[6]?3:0)+cp(w,ans)*1.5-Math.abs(w.length-ans.length)+cp(x[0],v[0])*0.5+Math.random()*2};
 const seen={};seen[ans]=1;
 const top=V.filter(x=>x!==v&&!seen[x[kd]]&&(x[6]==="sep")===(v[6]==="sep")&&!x[0].endsWith(v[0])&&!v[0].endsWith(x[0])).map(x=>[sc(x),x[kd]]).sort((a,b)=>b[0]-a[0]);
 const bad=[];top.forEach(t=>{if(bad.length<3&&!seen[t[1]]){seen[t[1]]=1;bad.push(t[1])}});
 F.q={v,kd,ans,opts:shuffle([ans].concat(bad))};F.pick=null;F.typed=false}

  t=F.deck.splice(i,1)[0];F.since++}
 genQ(t[0],t[1])}
